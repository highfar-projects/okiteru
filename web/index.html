<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Okiteru?">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<title>Okiteru?</title>
</head>
<body>
<header>
  <h1>Okiteru?</h1>
  <div class="header-buttons">
    <select id="lang" data-i18n-aria="lang.label"></select>
    <button id="notify" type="button" data-i18n="header.notify_off"></button>
    <button id="logout" type="button" hidden data-i18n="header.logout"></button>
    <button id="open-add" type="button" class="primary" data-i18n="header.add"></button>
  </div>
</header>

<main>
  <p id="banner" class="banner" role="status" hidden></p>
  <p id="notify-note" class="note" role="status"></p>
  <ul id="devices" class="devices"></ul>
  <p id="empty" class="empty" hidden data-i18n="empty"></p>

  <details class="help">
    <summary data-i18n="help.summary"></summary>
    <p data-i18n="help.intro"></p>
    <ol>
      <li data-i18n="help.1"></li>
      <li data-i18n="help.2"></li>
      <li data-i18n="help.3"></li>
      <li data-i18n="help.4"></li>
      <li data-i18n="help.5"></li>
    </ol>
    <p data-i18n="help.check"></p>
  </details>
</main>

<dialog id="add-dialog">
  <h2 data-i18n="add.title"></h2>
  <p class="hint" data-i18n="add.hint"></p>
  <button id="scan" type="button" class="primary wide" data-i18n="add.scan"></button>
  <p id="scan-note" class="note" role="status"></p>
  <ul id="candidates" class="candidates"></ul>

  <details class="manual">
    <summary data-i18n="add.manual"></summary>
    <form id="manual-form">
      <label><span data-i18n="field.name"></span><input name="name" required maxlength="64" autocomplete="off"></label>
      <label><span data-i18n="field.mac"></span><input name="mac" required placeholder="AA:BB:CC:DD:EE:FF" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label><span data-i18n="field.ip"></span><input name="ip" required placeholder="192.168.0.10" inputmode="decimal" autocomplete="off"></label>
      <label><span data-i18n="field.check_port"></span><input name="check_port" type="number" min="1" max="65535" value="445" list="ports"></label>
      <p id="manual-note" class="note" role="alert"></p>
      <button type="submit" class="primary wide" data-i18n="add.submit"></button>
    </form>
  </details>

  <div class="actions"><button id="close-add" type="button" data-i18n="close"></button></div>
</dialog>

<dialog id="edit-dialog">
  <h2 data-i18n="edit.title"></h2>
  <form id="edit-form">
    <label><span data-i18n="field.name"></span><input name="name" required maxlength="64" autocomplete="off"></label>
    <label><span data-i18n="field.ip"></span><input name="ip" required inputmode="decimal" autocomplete="off"></label>
    <label><span data-i18n="field.check_port"></span><input name="check_port" type="number" min="1" max="65535" list="ports" required></label>
    <label><span data-i18n="edit.power"></span>
      <select name="power">
        <option value="hibernate" data-i18n="power.hibernate"></option>
        <option value="sleep" data-i18n="power.sleep"></option>
        <option value="shutdown" data-i18n="power.shutdown"></option>
      </select>
    </label>
    <label><span data-i18n="edit.tailnet_ip"></span><input name="tailnet_ip" placeholder="100.x.x.x" inputmode="decimal" autocomplete="off"></label>
    <p class="hint" data-i18n="edit.agent_hint" data-i18n-code="okiteru install --agent"></p>
    <p class="hint" id="edit-mac-line"></p>
    <p id="edit-note" class="note" role="alert"></p>
    <button type="submit" class="primary wide" data-i18n="edit.save"></button>
  </form>
  <div class="actions">
    <button id="delete" type="button" class="danger" data-i18n="delete"></button>
    <button id="close-edit" type="button" data-i18n="close"></button>
  </div>
</dialog>

<dialog id="schedule-dialog">
  <h2 id="schedule-title" data-i18n="sched.title_default"></h2>
  <p class="hint" data-i18n="sched.hint"></p>
  <ul id="schedule-list" class="schedules"></ul>
  <p id="schedule-empty" class="hint" hidden data-i18n="sched.empty"></p>
  <form id="schedule-form">
    <h3 data-i18n="sched.add"></h3>
    <label><span data-i18n="sched.time"></span><input name="time" type="time" required value="07:30"></label>
    <label><span data-i18n="sched.repeat"></span>
      <select name="repeat">
        <option value="weekly" data-i18n="sched.weekly"></option>
        <option value="once" data-i18n="sched.once"></option>
      </select>
    </label>
    <fieldset id="schedule-days" class="days">
      <legend data-i18n="sched.days"></legend>
      <label><input type="checkbox" name="day" value="0" checked><span data-i18n="day.0"></span></label>
      <label><input type="checkbox" name="day" value="1" checked><span data-i18n="day.1"></span></label>
      <label><input type="checkbox" name="day" value="2" checked><span data-i18n="day.2"></span></label>
      <label><input type="checkbox" name="day" value="3" checked><span data-i18n="day.3"></span></label>
      <label><input type="checkbox" name="day" value="4" checked><span data-i18n="day.4"></span></label>
      <label><input type="checkbox" name="day" value="5"><span data-i18n="day.5"></span></label>
      <label><input type="checkbox" name="day" value="6"><span data-i18n="day.6"></span></label>
    </fieldset>
    <label id="schedule-date-label" hidden><span data-i18n="sched.date"></span><input name="date" type="date"></label>
    <p id="schedule-note" class="note" role="alert"></p>
    <button type="submit" class="primary wide" data-i18n="add.submit"></button>
  </form>
  <div class="actions"><button id="close-schedule" type="button" data-i18n="close"></button></div>
</dialog>

<dialog id="login-dialog">
  <h2 data-i18n="login.title"></h2>
  <form id="login-form">
    <label><span data-i18n="login.pin"></span><input name="pin" type="password" required autocomplete="current-password" autocapitalize="off" spellcheck="false"></label>
    <p id="login-note" class="note" role="alert"></p>
    <button type="submit" class="primary wide" data-i18n="login.submit"></button>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <h2 id="confirm-title"></h2>
  <p id="confirm-detail" class="confirm-detail"></p>
  <p id="confirm-warning" class="confirm-warning" role="alert" hidden></p>
  <div class="actions">
    <button id="confirm-no" type="button" autofocus data-i18n="confirm.no"></button>
    <button id="confirm-yes" type="button" class="danger"></button>
  </div>
</dialog>

<datalist id="ports">
  <option value="3389" data-i18n-label="port.rdp"></option>
  <option value="445" data-i18n-label="port.smb"></option>
  <option value="22" label="SSH"></option>
</datalist>

<script src="/i18n.js" defer></script>
</body>
</html>
