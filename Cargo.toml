[package]
name = "okiteru"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/highfar-projects/okiteru"
readme = "README.md"
description = "Wake-on-LAN relay for your tailnet: wake and monitor LAN machines from your phone"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
if-addrs = "0.15.0"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
ureq = "3.5.0"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
