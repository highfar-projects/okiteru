[package]
name = "okiteru"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Wake-on-LAN relay for your tailnet: wake and monitor LAN machines from your phone"

[dependencies]
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
